name: Build VisionClaude IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pin Meta DAT SDK to 0.5.0 (compatible with StreamSession API)
        run: |
          find . \( -name "project.yml" -o -name "project.pbxproj" -o -name "Package.resolved" \) -exec \
            sed -i '' 's/from: "0\.[0-9]\+\.[0-9]\+"/exactVersion: "0.5.0"/g; s/from: "1\.[0-9]\+\.[0-9]\+"/exactVersion: "0.5.0"/g' {} +
          find . -name "project.pbxproj" -exec \
            perl -0777 -i -pe 's/(meta-wearables-dat-ios.*?requirement = \{[^}]*?)kind = upToNextMajorVersion;\s*minimumVersion = [^;]+;/$1kind = exactVersion;\n\t\t\t\tversion = 0.5.0;/gs' {} +
          find . -name "Package.resolved" -delete

      - name: Locate Xcode project and generate if needed
        id: locate
        run: |
          if find . -name "project.yml" | grep -q .; then
            brew install xcodegen
            find . -name "project.yml" -execdir xcodegen generate \;
          fi
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 4 | head -n 1)
          echo "project=$PROJECT" >> $GITHUB_OUTPUT
          echo "Found project: $PROJECT"

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${{ steps.locate.outputs.project }}" \
            -scheme "ClaudeVision" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Build unsigned xcarchive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "${{ steps.locate.outputs.project }}" \
            -scheme "ClaudeVision" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -archivePath "$RUNNER_TEMP/VisionClaude.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || true

          if [ ! -d "$RUNNER_TEMP/VisionClaude.xcarchive" ]; then
            echo "=== EXACT COMPILER ERRORS ==="
            grep -E "\.swift:[0-9]+:[0-9]+: error:|error:" "$RUNNER_TEMP/xcodebuild.log" -C 3 || tail -n 100 "$RUNNER_TEMP/xcodebuild.log"
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/VisionClaude.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r VisionClaude.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaude-iOS
          path: ${{ runner.temp }}/VisionClaude.ipa
