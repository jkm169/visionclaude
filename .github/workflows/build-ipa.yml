name: Build VisionClaude IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Xcode project if needed
        run: |
          if command -v xcodegen &> /dev/null; then
            find . -name "project.yml" -execdir xcodegen generate \;
          else
            brew install xcodegen
            find . -name "project.yml" -execdir xcodegen generate \;
          fi

      - name: Build unsigned xcarchive
        run: |
          xcodebuild archive \
            -project ClaudeVision/ios/ClaudeVision.xcodeproj \
            -scheme ClaudeVision \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ClaudeVision.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/VisionClaude.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r VisionClaude.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaude-iOS
          path: ${{ runner.temp }}/VisionClaude.ipa
